<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Export Complete - ComicCraft</title>

    <style>

        body {
            margin: 0;
            background: #11111b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
        }

        .card {
            background: #1b1b29;
            padding: 40px;
            border-radius: 18px;
        }

        a {
            display: block;
            margin-top: 20px;
            padding: 13px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 9px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Comic Exported
        </h1>

        <p>
            Your comic PDF has been generated successfully.
        </p>

        <a
            href="/static/generated/comic.pdf"
            download="ComicCraft-Comic.pdf"
        >
            Download Comic PDF
        </a>

        <a href="/">
            Create Another Comic
        </a>

    </div>

</div>

</body>

</html>
